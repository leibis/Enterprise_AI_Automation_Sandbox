# 1. El nombre de tu banda transportadora (Pipeline)
name: AAA Club Alliance - Automated QA Regression Suite

# 2. ¿Cuándo se activa este pipeline?
on:
  # Se activa automáticamente cada vez que alguien hace un "git push" (sube cambios)
  # o hace un "pull request" (solicitud de unión) en la rama principal (main)
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 3. ¿Qué trabajos (jobs) debe realizar el servidor de la nube?
jobs:
  run-pytest-suite:
    # Le decimos a GitHub que use una computadora virtual con Linux Ubuntu de última generación
    runs-on: ubuntu-latest

    steps:
    # PASO 1: Descargar el código de nuestro repositorio de GitHub a la máquina virtual
    - name: Checkout repository code
      uses: actions/checkout@v4

    # PASO 2: Instalar la versión oficial de Python 3.12 en la máquina virtual
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # PASO 3: Instalar las dependencias de QA (Nuestros ladrillos)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest google-cloud-bigquery pandas db-dtypes requests playwright
        playwright install chromium

    # PASO 4: EJECUTAR EL QUALITY GATE (Con inyección segura de secretos)
    # Usamos la palabra clave "env" para inyectar la variable de entorno desde los secretos de GitHub
    - name: Execute pytest regression suite
      env:
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      run: |
        # Ejecutamos Pytest con nuestra suite completa
        pytest -v -s