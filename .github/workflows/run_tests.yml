name: Enterprise AI Sandbox - Automated QA Regression Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    name: ${{ matrix.suite }} Quality Gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite: [ai, api, cloud, ui]

    steps:
      # PASO 1: Descargar el código
      - name: Checkout repository code
        uses: actions/checkout@v5

      # PASO 2: Configurar Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PASO 3: Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      # PASO 4: Ejecutar únicamente la categoría correspondiente
      - name: Execute ${{ matrix.suite }} test suite
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          python -m pytest \
            -m "${{ matrix.suite }}" \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html \
            -v \
            -s

          echo "Coverage report generated for ${{ matrix.suite }} suite."

      # PASO 5: Subir reporte independiente
      - name: Upload ${{ matrix.suite }} coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.suite }}
          path: htmlcov/